[project]
name = "h5xdmf"
dynamic = ["version"]
description = "Generate XDMF3 visualization files from HDF5 output (scheme_version aware)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.26",
]

[project.scripts]
h5xdmf = "h5xdmf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h5xdmf"]

[tool.hatch.version]
path = "src/h5xdmf/_version.py"

[dependency-groups]
dev = [
    "pytest>=8",
]
